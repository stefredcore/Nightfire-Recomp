# Mouse and keyboard for Nightfire (start.bat sets RECOMP_MKB=1 and points
# here). F9 switches mouse and keyboard on and off in the game.
#
# Each line "action or Xbox control = keys" (up to four, with commas). The
# easiest way is the launcher's Settings > Edit controls. Keys:
# a-z, 0-9, f1-f12, space, enter, escape, tab, backspace, lshift, rshift,
# lctrl, rctrl, lalt, up/down/left/right, leftbracket, rightbracket,
# mouse1 (left), mouse2 (right), mouse3 (wheel click), mouse4/mouse5
# (side buttons), wheelup/wheeldown (the wheel, one press per notch),
# aim+wheelup/aim+wheeldown (the wheel while aiming: zoomed in, the lighter's
# camera, or "manual aim" held).
# Lines with "+" (+forward, +jump, ...) are game actions as in the PC
# version; they go straight into the game, past the controller scheme.
#
# On foot: the default layout of the official PC version (config.cfg from
# bond\assets.007).
# What the PC version does not have (manual aim, gadgets, zoom) sits on free
# keys next to it. Driving: the PC version has no driving missions.

[*]
# Mouse: sensitivity (sens), mouse travel per second for full stick
# deflection (full_cps, smaller = more sensitive), the game's assumed dead
# zone (dz, larger = small movements get through sooner), curve (acc, below
# 1 lifts slow movements more), invert Y.
sens = 1.0
full_cps = 1500
dz = 0.28
acc = 0.6
invert_y = 0

# The mouse turns the view directly as in the PC version: per mouse count
# sensitivity * 0.022 degrees (PC default: 2, here 3.5). No stick in between;
# the controller stays as it is. On foot and on the guns of the driving
# missions (Alpine Escape, Paris Prelude).
sensitivity = 3.5

[nightfire]
mouse_stick = none
aim_control = +aim

# A scheme of its own: each line is a game action and goes straight into the
# game, whatever the controller scheme in the game. Unlike on the controller
# each key has one job: the arrow keys only move in the menus, Q only
# switches the gadget. Up to four keys per line.

# Walk / strafe (PC: W A S D)
+forward     = w
+back        = s
+moveleft    = a
+moveright   = d

+attack      = mouse1            # Fire (PC: left mouse)
+attack2     = mouse2            # Right mouse as on the PC: alternate fire (pistol:
                                 # silencer); with a scope: zoom; with the lighter:
                                 # its camera
+aim         = mouse3            # Manual aim
+jump        = space             # Jump (PC: Space)
+duck        = lctrl             # Crouch (PC: Ctrl)
+use         = r                 # Use / reload (PC: E, R)
+vision      = v                 # Vision mode (PC: F goggles, V goggle mode)
+nextweapon  = wheelup                 # Next weapon (PC: wheel up, ])
+prevweapon  = wheeldown               # Previous weapon (PC: wheel down, [)
+nextgadget  = e                 # Next gadget (PC: G "selectmode")
+prevgadget  = q                 # Previous gadget
+zoomin      = aim+wheelup       # Zoom in while aiming
+zoomout     = aim+wheeldown     # Zoom out while aiming
+pause       = escape            # Pause (PC: Esc)

# Menus
+menu_up     = up, w, wheelup
+menu_down   = down, s, wheeldown
+menu_left   = left, a
+menu_right  = right, d
+menu_accept = enter             # Accept
+menu_back   = escape, backspace # Back (Esc: back in menus, pause in a mission)
+menu_y      = space             # Y button in menus
+menu_x      = e                 # X button in menus

[nightfire_driving]
mouse_stick = none
+attack          = mouse1        # Fire on the gun (the right trigger there)
+attack2         = mouse2        # Scope on the gun (the left trigger there)

left_stick_left  = a, left
left_stick_right = d, right
dpad_up          = w, up         # Menus: up (free while driving)
dpad_down        = s, down       # Menus: down (free while driving)
right_trigger    = w, up         # Gas
left_trigger     = s, down       # Brake / reverse
b                = space         # Handbrake
a                = mouse1, lshift # Fire (accept in menus)
x                = mouse2, f     # Use gadget
y                = c             # Camera view
white            = wheeldown, q            # Previous weapon
black            = wheelup, e              # Next weapon
right_thumb      = lshift, lctrl # Look back
start            = escape        # Pause
