; Settings of the enhanced mode. The original mode plays as the console does
; and reads only Fullscreen here.

[Graphics]
; Resolution: the size the game draws its picture at, as <width>x<height>,
; best your monitor's: 1920x1080, 2560x1440, 3840x2160 ... for 16:9
; (Widescreen = 1), 1280x960, 1600x1200 ... for 4:3. 640x480 is the
; console's. Higher costs more graphics power. An older value 1 to 8 still
; works: that many times 640x480.
Resolution = 1280x960

; DrivingAA: 1 = the driving missions keep the console's anti-aliasing: each
; pixel drawn twice and averaged, double the graphics power, so above 1440
; lines they are drawn a little less high and shown at full size. 0 = they
; are drawn at the chosen resolution like the rest of the game.
DrivingAA = 0

; Widescreen: 1 = 16:9 while playing, as on the GameCube. The console tells
; the game it has a widescreen TV; it then shows more of the world at the
; sides, and the displays stay in their place, undistorted. Menus, loading
; screens and cutscenes stay 4:3. 2 = ultrawide (21:9): wider still, in the
; shape of Resolution (3440x1440, 2560x1080 ...). The Xbox game itself has
; neither; 0 = 4:3 as the console.
Widescreen = 0

; Anisotropy: keeps floors and walls sharp into the distance when seen at a
; flat angle. 1 = off as the console, else 2, 4, 8 or 16.
Anisotropy = 16

; FlickerFilter: 1 = a soft picture as the console gives a TV, each line mixed
; with its neighbours. 0 = off (sharp). The original mode always has it.
FlickerFilter = 0

; VSync: 1 = each frame waits for the monitor, no tearing. 0 = each frame at
; once, about 20 ms less delay, but the picture can tear.
VSync = 1

; RefreshRate: 60 = a European disc plays at 60 Hz, as the North-American
; version does (smoother; the same game, its movies and texts). 50 = as a
; European console. A North-American disc is always 60.
RefreshRate = 50

; Fullscreen: 1 = the game starts in fullscreen (borderless). F11 or
; Alt+Enter switch in the game either way. Read in both modes.
Fullscreen = 0
